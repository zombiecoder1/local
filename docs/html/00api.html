<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Zombie API Console</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:20px}
    .wrap{max-width:900px;margin:0 auto}
    .card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin:12px 0}
    .row{display:flex;gap:8px}
    input,textarea,button{border-radius:6px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;padding:8px}
    textarea{width:100%;height:100px}
    button{cursor:pointer}
    #out{white-space:pre-wrap;font-family:Consolas,monospace;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px;min-height:160px}
    .hint{color:#8b949e;font-size:12px}
    label{display:block;margin:6px 0 4px}
    .ok{color:#3fb950}
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Hello Zombie API Console</h2>
    <div class="card">
      <div class="row">
        <div style="flex:1">
          <label>Base URL</label>
          <input id="base" value="http://127.0.0.1:8001/v1" />
      </div>
        <div style="width:220px">
          <label>Model</label>
          <input id="model" value="deepseek-coder-1.3b" />
            </div>
          </div>
      <label>Message</label>
      <textarea id="msg">বাংলায় দুই লাইনের একটি শুভেচ্ছা বার্তা লিখো।</textarea>
            <div class="row">
        <button onclick="send(false)">Send (non-stream)</button>
        <button onclick="send(true)">Send (stream)</button>
        <span class="hint">Header: X-HelloZombie-Status: Setup-Complete</span>
            </div>
          </div>

    <div class="card">
      <div class="row" style="align-items:center;justify-content:space-between">
        <strong>Output</strong>
        <code id="latency"></code>
            </div>
      <div id="out"></div>
          </div>
  </div>

  <script>
async function send(stream){
  const base = document.getElementById('base').value.replace(/\/$/,'');
  const model = document.getElementById('model').value;
  const content = document.getElementById('msg').value;
  const out = document.getElementById('out');
  const latency = document.getElementById('latency');
  out.textContent=''; latency.textContent='';
  const t0 = performance.now();

  const body = { model, messages:[{role:'user',content}], stream: !!stream };
  const url = base + '/chat/completions';
  const headers = { 'Content-Type':'application/json','X-HelloZombie-Status':'Setup-Complete' };

  if(!stream){
    const r = await fetch(url, {method:'POST', headers, body: JSON.stringify(body)});
    const data = await r.json();
    latency.textContent = Math.round(performance.now()-t0)+' ms';
    out.textContent = JSON.stringify(data,null,2);
        return;
      }
      
  const r = await fetch(url, {method:'POST', headers, body: JSON.stringify(body)});
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while(true){
    const {value,done} = await reader.read();
    if(done) break;
    const chunk = dec.decode(value);
    buf += chunk;
    out.textContent += chunk;
  }
  latency.textContent = Math.round(performance.now()-t0)+' ms';
}
  </script>
</body>
</html>
