<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Services Test - Real Response Check</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .test-section h2 {
            color: #444;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .service-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            background: white;
            border-radius: 5px;
            border-left: 4px solid #ccc;
        }
        .service-item.success { border-left-color: #4caf50; }
        .service-item.error { border-left-color: #f44336; }
        .service-item.pending { border-left-color: #ff9800; }
        .status {
            font-weight: bold;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
        }
        .status.success { background: #4caf50; color: white; }
        .status.error { background: #f44336; color: white; }
        .status.pending { background: #ff9800; color: white; }
        .service-name { font-weight: 600; color: #333; }
        .service-url { font-size: 11px; color: #666; margin-top: 3px; }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
            transition: all 0.3s;
        }
        button:hover { background: #5568d3; transform: translateY(-2px); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .btn-container { text-align: center; margin: 30px 0; }
        .response-box {
            margin-top: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .timestamp {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }
        .summary {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .summary h3 {
            color: #1976d2;
            margin-bottom: 10px;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 All Services Test - Real Response Verification</h1>
        <p class="subtitle">Testing all services with real API calls and responses</p>
        
        <div class="btn-container">
            <button onclick="testAllServices()">Test All Services</button>
            <button onclick="testStreaming()">Test Streaming</button>
            <button onclick="testNonStreaming()">Test Non-Streaming</button>
            <button onclick="clearResults()">Clear Results</button>
        </div>

        <div class="test-section">
            <h2>📡 Service Health Checks</h2>
            <div id="healthResults"></div>
        </div>

        <div class="test-section">
            <h2>🌊 Streaming Test</h2>
            <div id="streamingResults"></div>
        </div>

        <div class="test-section">
            <h2>📝 Non-Streaming Test</h2>
            <div id="nonStreamingResults"></div>
        </div>

        <div class="summary">
            <h3>📊 Test Summary</h3>
            <div id="summary"></div>
        </div>

        <div class="timestamp" id="timestamp"></div>
    </div>

    <script>
        const SERVICES = [
            { name: 'Gateway', url: 'http://127.0.0.1:8001', port: 8001 },
            { name: 'Ollama Server', url: 'http://127.0.0.1:8155', port: 8155 },
            { name: 'Bengali NLP', url: 'http://127.0.0.1:8002', port: 8002 },
            { name: 'Code Generation', url: 'http://127.0.0.1:8003', port: 8003 },
            { name: 'Code Review', url: 'http://127.0.0.1:8004', port: 8004 },
            { name: 'Documentation', url: 'http://127.0.0.1:8005', port: 8005 },
            { name: 'Testing', url: 'http://127.0.0.1:8006', port: 8006 },
            { name: 'Deployment', url: 'http://127.0.0.1:8008', port: 8008 },
            { name: 'Orchestrator', url: 'http://127.0.0.1:8100', port: 8100 }
        ];

        let testResults = {
            health: {},
            streaming: null,
            nonStreaming: null
        };

        function updateTimestamp() {
            document.getElementById('timestamp').textContent = 
                `Last updated: ${new Date().toLocaleString()}`;
        }

        function createServiceItem(name, url, status, response) {
            const statusClass = status === 'success' ? 'success' : status === 'error' ? 'error' : 'pending';
            return `
                <div class="service-item ${statusClass}">
                    <div>
                        <div class="service-name">${name}</div>
                        <div class="service-url">${url}</div>
                    </div>
                    <div class="status ${statusClass}">${status.toUpperCase()}</div>
                </div>
                ${response ? `<div class="response-box">${response}</div>` : ''}
            `;
        }

        async function checkHealth(service) {
            try {
                const response = await fetch(`${service.url}/health`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' },
                    signal: AbortSignal.timeout(5000)
                });
                
                if (response.ok) {
                    const data = await response.json();
                    return {
                        status: 'success',
                        data: JSON.stringify(data, null, 2)
                    };
                } else {
                    return {
                        status: 'error',
                        data: `HTTP ${response.status}: ${response.statusText}`
                    };
                }
            } catch (error) {
                return {
                    status: 'error',
                    data: `Error: ${error.message}`
                };
            }
        }

        async function testAllServices() {
            const resultsDiv = document.getElementById('healthResults');
            resultsDiv.innerHTML = '<p>Testing all services...</p>';
            updateTimestamp();

            let successCount = 0;
            let errorCount = 0;

            for (const service of SERVICES) {
                const result = await checkHealth(service);
                testResults.health[service.name] = result;
                
                resultsDiv.innerHTML += createServiceItem(
                    service.name,
                    service.url,
                    result.status,
                    result.data
                );

                if (result.status === 'success') successCount++;
                else errorCount++;

                await new Promise(resolve => setTimeout(resolve, 500));
            }

            updateSummary();
        }

        async function testStreaming() {
            const resultsDiv = document.getElementById('streamingResults');
            resultsDiv.innerHTML = '<p>Testing streaming...</p>';

            try {
                const response = await fetch('http://127.0.0.1:8001/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer sk-sahon-personal-2024'
                    },
                    body: JSON.stringify({
                        model: 'deepseek-coder-1.3b',
                        messages: [{ role: 'user', content: 'Hello, test streaming' }],
                        stream: true
                    })
                });

                if (response.ok) {
                    const contentType = response.headers.get('Content-Type');
                    let chunks = 0;
                    let content = '';

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        
                        chunks++;
                        const chunk = decoder.decode(value);
                        content += chunk;
                        
                        if (chunks <= 5) {
                            resultsDiv.innerHTML = `
                                <div class="service-item success">
                                    <div>
                                        <div class="service-name">Streaming Test</div>
                                        <div class="service-url">Chunks received: ${chunks}</div>
                                    </div>
                                    <div class="status success">STREAMING</div>
                                </div>
                                <div class="response-box">${content.substring(0, 500)}...</div>
                            `;
                        }
                    }

                    testResults.streaming = {
                        status: 'success',
                        chunks: chunks,
                        contentType: contentType,
                        data: content.substring(0, 1000)
                    };

                    resultsDiv.innerHTML = `
                        <div class="service-item success">
                            <div>
                                <div class="service-name">Streaming Test</div>
                                <div class="service-url">Chunks: ${chunks} | Content-Type: ${contentType}</div>
                            </div>
                            <div class="status success">SUCCESS</div>
                        </div>
                        <div class="response-box">${content.substring(0, 1000)}...</div>
                    `;
                } else {
                    const errorText = await response.text();
                    testResults.streaming = {
                        status: 'error',
                        data: `HTTP ${response.status}: ${errorText}`
                    };
                    resultsDiv.innerHTML = createServiceItem(
                        'Streaming Test',
                        'http://127.0.0.1:8001/v1/chat/completions',
                        'error',
                        `HTTP ${response.status}: ${errorText}`
                    );
                }
            } catch (error) {
                testResults.streaming = {
                    status: 'error',
                    data: error.message
                };
                resultsDiv.innerHTML = createServiceItem(
                    'Streaming Test',
                    'http://127.0.0.1:8001/v1/chat/completions',
                    'error',
                    error.message
                );
            }

            updateSummary();
            updateTimestamp();
        }

        async function testNonStreaming() {
            const resultsDiv = document.getElementById('nonStreamingResults');
            resultsDiv.innerHTML = '<p>Testing non-streaming...</p>';

            try {
                const response = await fetch('http://127.0.0.1:8001/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer sk-sahon-personal-2024'
                    },
                    body: JSON.stringify({
                        model: 'deepseek-coder-1.3b',
                        messages: [{ role: 'user', content: 'Hello, test non-streaming' }],
                        stream: false
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    testResults.nonStreaming = {
                        status: 'success',
                        data: JSON.stringify(data, null, 2)
                    };
                    resultsDiv.innerHTML = createServiceItem(
                        'Non-Streaming Test',
                        'http://127.0.0.1:8001/v1/chat/completions',
                        'success',
                        JSON.stringify(data, null, 2).substring(0, 1000)
                    );
                } else {
                    const errorText = await response.text();
                    testResults.nonStreaming = {
                        status: 'error',
                        data: `HTTP ${response.status}: ${errorText}`
                    };
                    resultsDiv.innerHTML = createServiceItem(
                        'Non-Streaming Test',
                        'http://127.0.0.1:8001/v1/chat/completions',
                        'error',
                        `HTTP ${response.status}: ${errorText}`
                    );
                }
            } catch (error) {
                testResults.nonStreaming = {
                    status: 'error',
                    data: error.message
                };
                resultsDiv.innerHTML = createServiceItem(
                    'Non-Streaming Test',
                    'http://127.0.0.1:8001/v1/chat/completions',
                    'error',
                    error.message
                );
            }

            updateSummary();
            updateTimestamp();
        }

        function updateSummary() {
            const summaryDiv = document.getElementById('summary');
            let healthSuccess = 0;
            let healthError = 0;

            for (const [name, result] of Object.entries(testResults.health)) {
                if (result.status === 'success') healthSuccess++;
                else healthError++;
            }

            summaryDiv.innerHTML = `
                <div class="summary-item">
                    <span>Health Checks:</span>
                    <span><strong>${healthSuccess} Success</strong> / ${healthError} Error</span>
                </div>
                <div class="summary-item">
                    <span>Streaming:</span>
                    <span>${testResults.streaming ? (testResults.streaming.status === 'success' ? '✅ SUCCESS' : '❌ FAILED') : '⏳ PENDING'}</span>
                </div>
                <div class="summary-item">
                    <span>Non-Streaming:</span>
                    <span>${testResults.nonStreaming ? (testResults.nonStreaming.status === 'success' ? '✅ SUCCESS' : '❌ FAILED') : '⏳ PENDING'}</span>
                </div>
            `;
        }

        function clearResults() {
            document.getElementById('healthResults').innerHTML = '';
            document.getElementById('streamingResults').innerHTML = '';
            document.getElementById('nonStreamingResults').innerHTML = '';
            document.getElementById('summary').innerHTML = '';
            testResults = { health: {}, streaming: null, nonStreaming: null };
            updateTimestamp();
        }

        // Auto-run on page load
        window.onload = function() {
            updateTimestamp();
            setTimeout(() => {
                testAllServices();
            }, 1000);
        };
    </script>
</body>
</html>
